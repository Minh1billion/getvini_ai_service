name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: pip install maturin -r requirements.txt -r requirements-dev.txt
      - run: maturin build --release -o dist
      - run: pip install --no-deps dist/*.whl
      - run: pytest
