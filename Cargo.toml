[package]
name = "structural"
version = "0.1.0"
edition = "2024"

[lib]
name = "structural"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38"] }
calamine = "0.32"
serde_json = "1"
ureq = "3"
chrono = "0.4"
phonenumber = "0.3"
regex = "1"
unicode-normalization = "0.1"
